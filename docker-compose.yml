services:
  cpu-bound:
    build: ./cpu-bound
    image: viniciusi4n/cpu-bound
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      POW_MAX_DIFFICULTY: ${POW_MAX_DIFFICULTY:-10}
      POW_TIMEOUT_MS: ${POW_TIMEOUT_MS:-300000}
      SERVER_MAX_THREADS: ${CPU_SERVER_MAX_THREADS:-200}

  io-bound-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10

  io-bound:
    build: ./io-bound
    image: viniciusi4n/io-bound
    restart: unless-stopped
    depends_on:
      io-bound-db:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      DB_URL: jdbc:postgresql://io-bound-db:5432/shortener
      DB_USER: shortener
      DB_PASSWORD: shortener
      BASE_URL: ${IO_BASE_URL:-http://localhost:8082}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      SIMULATED_DB_LATENCY_MS: ${SIMULATED_DB_LATENCY_MS:-50}
      VIRTUAL_THREADS: ${VIRTUAL_THREADS:-false}
      SERVER_MAX_THREADS: ${IO_SERVER_MAX_THREADS:-200}

  memory-bound:
    build: ./memory-bound
    image: viniciusi4n/memory-bound
    restart: unless-stopped
    ports:
      - "8083:8080"
    command:
      - --port
      - "8080"
      - --csv
      - data/students.csv
      - --scale
      - "${MB_SCALE:-0}"
      - --history
      - "${MB_HISTORY:-32}"
    volumes:
      - students-data:/app/data

volumes:
  pgdata:
  students-data:
