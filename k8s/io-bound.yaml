apiVersion: apps/v1
kind: Deployment
metadata:
  name: io-bound
  namespace: poi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: io-bound
  template:
    metadata:
      labels:
        app: io-bound
    spec:
      containers:
        - name: io-bound
          image: io-bound:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/shortener
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: BASE_URL
              value: http://150.165.85.77:8082
            - name: DB_POOL_SIZE
              value: "10"
            - name: SIMULATED_DB_LATENCY_MS
              value: "50"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: io-bound
  namespace: poi
spec:
  type: NodePort
  selector:
    app: io-bound
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30082
